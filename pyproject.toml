[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devai"
dynamic = ["version"]
description = "AI-powered developer assistant for code analysis, review, testing and software engineering automation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pathspec>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# AI analysis (Phase 3b): optional, so the core install stays dependency-light.
ai = ["anthropic>=1.9,<2"]

[project.scripts]
devai = "devai.cli:main"

[tool.setuptools.dynamic]
version = { attr = "devai.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (errors), I: import order,
# UP: modern Python syntax, B: common bug patterns (bugbear)
select = ["E", "F", "I", "UP", "B"]
