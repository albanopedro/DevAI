[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devai"
dynamic = ["version"]
description = "AI-powered developer assistant for code analysis, review, testing and software engineering automation."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pedro Albano" }]
requires-python = ">=3.11"
dependencies = ["pathspec>=0.12"]
keywords = [
    "code-review",
    "developer-tools",
    "static-analysis",
    "ai",
    "ollama",
    "opencode",
    "documentation",
    "testing",
    "github",
]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/albanopedro/DevAI"
Repository = "https://github.com/albanopedro/DevAI"
Issues = "https://github.com/albanopedro/DevAI/issues"
Changelog = "https://github.com/albanopedro/DevAI/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# httpx2: what FastAPI's TestClient uses to call the app without a server.
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2"]
# AI analysis: optional. Both providers (OpenCode CLI, Ollama) are free and
# talk over subprocess/HTTP from the standard library; Pydantic validates answers.
ai = ["pydantic>=2"]
# Web interface: optional. `devai serve` runs a local API (FastAPI) on 127.0.0.1
# with uvicorn; the React pages in web/ are built with Node, which users don't need.
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
devai = "devai.cli:main"

[tool.setuptools.dynamic]
version = { attr = "devai.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (errors), I: import order,
# UP: modern Python syntax, B: common bug patterns (bugbear)
select = ["E", "F", "I", "UP", "B"]
