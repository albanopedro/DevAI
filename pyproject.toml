[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devai"
dynamic = ["version"]
description = "AI-powered developer assistant for code analysis, review, testing and software engineering automation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devai = "devai.cli:main"

[tool.setuptools.dynamic]
version = { attr = "devai.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
